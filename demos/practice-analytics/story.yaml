id: practice-analytics
code: G10
title: Practice analytics on 10,000 patients
track: generic
stage: generic
readiness: new
runtime: 5-10 min
environment: '67842161'
offline: node demos/practice-analytics/run.mjs
default_mode: replay
live_mode_note: 'Live mode available once keys are added: a cloud agent runs prompt.md against the P2 pack. Key-free mode reads question 1 from the shared HbA1c views on the P2 10k pack (fetched with fetch.sh), or the committed 100-patient fixture if the fetch or checksum fails.'

persona: Product or analytics lead at {prospect}, a practice software company whose customers ask why their quality and visit numbers moved
trigger: Presenter pastes prompt.md into a new cloud agent started from the default branch
actors:
  - Cursor cloud agent
  - DuckDB (Python 1.1.3, from the L13 pack)
  - Demo Setup scorer (private answer key from L13)
surface: The L13 Synthea pack, queried as one practice's patient panel
data_pack: P2 synthea-analytics-10k from L13 (demos/analytics-10k). Parquet and analytics.duckdb unpack to ~/.cache/medplum-demos/synthea-analytics-10k. Committed fallback is demos/_shared/data-packs/synthea-analytics/fixture-100. This story adds only the practice-manager questions and the column contract
artifact: demos/practice-analytics/run/findings.md (one SQL query and result per question) and findings.json for question 1, in the shape L13's scorer reads
gate: Presenter reveals the answer-key score for question 1 after the agent commits to its answer. On-stage only
gate_blocks: false
wow: A practice manager's three questions over 10,000 synthetic patients get answered with SQL, and the agent finds the planted cause on its own
proof:
  - Draft PR link
  - run/findings.md with SQL and results for all three questions
  - Score from answer-keys://analytics-10k/ on question 1
reset: demos/practice-analytics/reset.sh
fallback: []
fallback_note: No recorded live agent run. run.mjs replays the analysis on the 10k pack, falling back to demos/_shared/data-packs/synthea-analytics/fixture-100 if fetch.sh fails
blast_radius: Local DuckDB reads only, plus a GitHub draft PR in gbriggs-cursor/medplum. No Jira writes
depends_on:
  - code: L13
    workstream: C
    planned_path: demos/analytics-10k
    provides: P2 pack at demos/_shared/data-packs/synthea-analytics (10k cache at ~/.cache/medplum-demos/synthea-analytics-10k, fixture-100 committed) and the scorer at answer-keys://analytics-10k/

variables:
  prospect: Foo Medical
  data_dir: ~/.cache/medplum-demos/synthea-analytics-10k
  month: March 2026

jira:
  project: GIO
  automation: false
  labels: [demo, medplum, 'story:practice-analytics', 'track:generic']

answer_key: answer-keys://analytics-10k/
