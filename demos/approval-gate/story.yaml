id: approval-gate
code: L6
title: Design review gate
track: ls
stage: '06'
readiness: new
runtime: 5 min
environment: '67842161'

persona: Design review lead or QA/RA approver at {prospect}
trigger: Presenter pastes prompt.md part 1 into a new cloud agent started from the default branch
actors:
  - Cursor cloud agent (builds evidence, opens the draft PR, records the decision)
  - Grok Bot (shows the approval card on stage)
  - Human approver on stage
surface: P1 device cohort tests (ECG summary parser, Foo Medical vitals ingest through MockClient)
data_pack: P1 device cohort in demos/_shared/data-packs/p1-device-cohort (20 synthetic patients, Acme Cardio patch v2, seed 20261104, from PR #11)
artifact: Evidence v2 in demos/approval-gate/evidence/ (EVIDENCE.md, trace.json, APPROVAL-CARD.md, then approval.json after the decision)
gate: The approval card. The build and draft PR finish without it; the decision is a follow-up message
gate_blocks: false
wow: A human approves on stage, approval.json records signer, meaning, and time against the evidence digest, and editing the evidence afterwards makes verify fail
proof:
  - Draft PR link with Approval pending, then a commit with approval.json
  - gate.mjs verify output VALID, then INVALID after a tamper edit
reset: demos/approval-gate/reset.sh
fallback: [11]
fallback_note: PR #11 shows the same cohort's v1 evidence package (no approval). There is no recorded approval take yet.
blast_radius: Local working tree and one GitHub draft PR in gbriggs-cursor/medplum. No Jira writes. Nothing is written back to Medplum

variables:
  prospect: Acme Cardio
  signer: Dana Reviewer
  role: Design review lead

jira:
  project: GIO
  automation: false
  labels: [demo, medplum, 'story:approval-gate', 'track:ls', 'stage:06']
