id: analytics-10k
code: L13
title: 10k-patient investigation
track: ls
stage: analytics
readiness: new
runtime: 5-10 min
environment: '67842161'

persona: Clinical quality or data lead at {prospect} who owns the diabetes dashboard
trigger: Presenter pastes prompt.md into a new cloud agent started from the default branch
actors:
  - Cursor cloud agent
  - DuckDB (Python 1.1.3)
  - Demo Setup scorer (private answer key)
surface: P2 analytics pack (flattened Synthea patients, encounters, conditions, observations, devices, device readings) in DuckDB/Parquet
data_pack: P2 synthea-analytics-10k, Synthea v3.3.0, 10,000 living patients, seed 20261112, end date 2026-10-01, every patient tagged synthetic + HTEST. P0 synthea-analytics-100 (seed 100) is the committed fixture
artifact: demos/analytics-10k/run/ with REPORT.md (answer, SQL, result tables), queries.sql, and findings.json; draft PR with the answer in the body
gate: Presenter reads the SQL that backs the answer, then Demo Setup shows the score against the hidden answer key. On-stage only
gate_blocks: false
wow: '"Why did A1c control drop in March?" The agent finds the root cause in 10,000 patients and backs it with SQL'
proof:
  - Draft PR link
  - run/REPORT.md with the answer and the SQL that proves it
  - Score from the private scorer (answer-keys://analytics-10k/score.py)
reset: demos/analytics-10k/reset.sh
fallback: []
fallback_note: No recorded run yet. Use the committed P0 fixture (demos/_shared/data-packs/synthea-analytics/fixture-100) to show the same queries on 100 patients
blast_radius: GitHub draft PR in gbriggs-cursor/medplum only. No Jira writes. No outside domains at demo time (the pack is preloaded at environment build)
answer_key: answer-keys://analytics-10k/

variables:
  prospect: Foo Medical
  data_dir: ~/.cache/medplum-demos/synthea-analytics-10k
  month: March 2026

jira:
  project: GIO
  automation: false
  labels: [demo, medplum, 'story:analytics-10k', 'track:ls', 'stage:analytics']
